services:
  backend:
    container_name: jantawave-backend
    build: .
    restart: always

    # CRITICAL: Use host networking for WebRTC UDP performance
    # This allows the container to use the VM's public IP directly
    network_mode: "host"

    # Load environment variables from the .env file on the VM
    env_file:
      - .env

    # Persist temporary files (FFmpeg SDPs, Overlay text files)
    volumes:
      - ./runtime/tmp:/app/tmp
      # Optional: If you want logs to persist outside container
      # - ./logs:/app/logs
